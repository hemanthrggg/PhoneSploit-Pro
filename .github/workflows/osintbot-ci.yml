name: OSINT Bot CI

on:
  pull_request:
    paths:
      - "osintbot/**"
      - ".github/workflows/osintbot-ci.yml"
  push:
    branches: [main]
    paths:
      - "osintbot/**"
      - ".github/workflows/osintbot-ci.yml"

jobs:
  osintbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile osintbot
        run: python -m compileall -q osintbot

      - name: Offline smoke tests
        run: python osintbot/ci_smoke.py
